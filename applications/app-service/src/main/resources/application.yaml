server:
  port: 8081
spring:
  application:
    name: "RequestsCrediYaMicroservice"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: ${DB_HOST:postgres}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:requests_db}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081"
adapter:
  restconsumer:
    timeout: 5000
    url: ${ADAPTER_RESTCONSUMER_URL:http://localhost:8080}
    paths:
      findByIdentificationNumber: "/api/v1/usuarios/{identificationNumber}"
      validateToken: "/auth/api/v1/validate/{jwt}"
      getAllUserInfoByEmail: "/api/v1/usuarios/email/{email}"

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
routes:
  paths:
    request: "/api/v1/requests"
    getAllRequests: "/api/v1/requests"
